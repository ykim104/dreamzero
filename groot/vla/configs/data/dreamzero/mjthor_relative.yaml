# @package _global_
# MjThor simulated pick-and-place data config for DreamZero.
# Usage: override mjthor_data_root via CLI, e.g.
#   mjthor_data_root=/path/to/mjthor/data

defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_

image_resolution_width: 320
image_resolution_height: 160

max_state_dim: 64
use_global_metadata: false
relative_action: true
relative_action_per_horizon: false
relative_action_keys:
  - joint_pos
max_chunk_size: 5
dataset_shard_sampling_rate: 0.5

# Path to the MjThor data root -- override via CLI
mjthor_data_root: ???
mjthor_drop_n_last_frames: 7

################################################################################
# Train dataset -- uses MjThorMixtureDataset.from_config
################################################################################

train_dataset:
  _target_: groot.vla.data.dataset.mjthor.MjThorMixtureDataset.from_config
  _convert_: object
  data_roots:
    - ${mjthor_data_root}
  selected_states:
    - qpos.arm
    - qpos.gripper
  selected_actions:
    - joint_pos.arm
    - joint_pos.gripper
  selected_observations:
    - droid_shoulder_light_randomization
    - randomized_zed2_analogue_1
    - wrist_camera_zed_mini
  embodiment_tag: mjthor
  modality_configs: ${modality_config_mjthor}
  transforms: ${transform_mjthor}
  drop_n_last_frames: ${mjthor_drop_n_last_frames}
  num_steps_per_shard: 10000
  img_size:
    - ${image_resolution_height}
    - ${image_resolution_width}
  training: true
  seed: 42
  shard_sampling_rate: ${dataset_shard_sampling_rate}
  max_chunk_size: ${max_chunk_size}
  relative_action: ${relative_action}
  relative_action_keys: ${relative_action_keys}
